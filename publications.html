<html>

<head>
	<title> Publications | Wei Weng's Sustainable Land-Water Systems Lab (SLWS) | NTU Geography</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="description"
		content="Sustainable Land-Water Systems Lab by Prof. Wei Weng, Department of Geography, National Taiwan University (NTU). Research, teaching, publications, and contact information for Prof. Wei Weng.">
	<meta name="keywords"
		content="Wei Weng, Sustainable Land-Water Systems Lab, SLWS, NTU Geography, National Taiwan University, research, aerial rivers, climate change, land-water systems, ESG">
	<link rel="stylesheet" href="assets/css/fontawesome-all.min.css" />
	<link rel="stylesheet" href="assets/css/main.css" />
</head>

<body class="homepage is-preload">
	<div id="page-wrapper">

		<!-- Header -->
		<!-- Please edit Header in "header.html" -->
		<div id="header"></div>

		<!-- Features -->


		<!-- Banner -->
		<a name="publications">
			<section id="features">
				<div class="container">
					<h2><strong>Publications</strong></h2>
					<ul id="publications-list" class="publications"></ul>
				</div>

			</section>
		</a>

		<!-- Footer -->
		<!-- Please edit Footer in "footer.html" -->
		<div id="footer"></div>

	</div>

	<!-- Scripts -->
	<script src="assets/js/jquery.min.js"></script>
	<script src="assets/js/jquery.dropotron.min.js"></script>
	<script src="assets/js/browser.min.js"></script>
	<script src="assets/js/breakpoints.min.js"></script>
	<script src="assets/js/util.js"></script>
	<script src="assets/js/main.js"></script>
	<script>
		fetch('header.html')
			.then(r => r.text())
			.then(t => {
				document.getElementById('header').innerHTML = t;
				if (window.jQuery && window.$) {
					// 移除舊的 navPanel 和 titleBar
					$('#navPanel').remove();
					$('#titleBar').remove();
					// 建立 navPanel
					$('<div id="navPanel"><nav>' + $('#nav').navList() + '</nav></div>')
						.appendTo('body')
						.panel({
							delay: 500,
							hideOnClick: true,
							hideOnSwipe: true,
							resetScroll: true,
							resetForms: true,
							side: 'left',
							target: $('body'),
							visibleClass: 'navPanel-visible'
						});
					// 建立 titleBar
					$('<div id="titleBar">' +
						'<a href="#navPanel" class="toggle"></a>' +
						'</div>').appendTo('body');
					// 綁定 toggle 按鈕事件
					$('.toggle').off('click').on('click', function (e) {
						e.preventDefault();
						$('body').toggleClass('navPanel-visible');
					});
				}
			});
		fetch('footer.html').then(r => r.text()).then(t => document.getElementById('footer').innerHTML = t);

		fetch('data/publications.json')
			.then(response => response.json())
			.then(items => {
				const list = document.getElementById('publications-list');
				list.innerHTML = items.map(item => `<li>${item.text}</li>`).join('');
			})
			.catch(error => {
				console.error('Failed to load publications data:', error);
			});
	</script>

</body>

</html>
