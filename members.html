<html>

<head>
	<title> Members | Wei Weng's Sustainable Land-Water Systems Lab (SLWS) | NTU Geography</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="description"
		content="Sustainable Land-Water Systems Lab by Prof. Wei Weng, Department of Geography, National Taiwan University (NTU). Research, teaching, publications, and contact information for Prof. Wei Weng.">
	<meta name="keywords"
		content="Wei Weng, Sustainable Land-Water Systems Lab, SLWS, NTU Geography, National Taiwan University, research, aerial rivers, climate change, land-water systems, ESG">
	<link rel="stylesheet" href="assets/css/fontawesome-all.min.css" />
	<link rel="stylesheet" href="assets/css/main.css" />
</head>

<body class="homepage is-preload">
	<div id="page-wrapper">

		<!-- Header -->
		<!-- Please edit Header in "header.html" -->
		<div id="header"></div>

		<!-- Members Card Section -->
		<section id="features" name="members">
			<div class="container">
				<header>
					<h2><strong>Current Members</strong></h2>
				</header>
				<div id="current-members" class="member-cards"></div>
				<!-- copy and paste to create more member cards! -->
				<!-- one may move cards to below after they leave the lab -->
				<br><br>
				<details class="alumni-details">
					<summary>
						<h2><strong>Alumni</strong></h2>
					</summary>
					<div id="alumni-members" class="member-cards"></div>
					<br>
					<!-- below is for alumni members without photos -->
					<div id="alumni-no-photo" class="member-cards no-photo"></div>
				</details>
			</div>
	</div>
	</section>

	<!-- Footer -->
	<!-- Please edit Footer in "footer.html" -->
	<div id="footer"></div>

	</div>

	<!-- Scripts -->
	<script src="assets/js/jquery.min.js"></script>
	<script src="assets/js/jquery.dropotron.min.js"></script>
	<script src="assets/js/browser.min.js"></script>
	<script src="assets/js/breakpoints.min.js"></script>
	<script src="assets/js/util.js"></script>
	<script src="assets/js/main.js"></script>
	<script>
		fetch('header.html')
			.then(r => r.text())
			.then(t => {
				document.getElementById('header').innerHTML = t;
				if (window.jQuery && window.$) {
					// 移除舊的 navPanel 和 titleBar
					$('#navPanel').remove();
					$('#titleBar').remove();
					// 建立 navPanel
					$('<div id="navPanel"><nav>' + $('#nav').navList() + '</nav></div>')
						.appendTo('body')
						.panel({
							delay: 500,
							hideOnClick: true,
							hideOnSwipe: true,
							resetScroll: true,
							resetForms: true,
							side: 'left',
							target: $('body'),
							visibleClass: 'navPanel-visible'
						});
					// 建立 titleBar
					$('<div id="titleBar">' +
						'<a href="#navPanel" class="toggle"></a>' +
						'</div>').appendTo('body');
					// 綁定 toggle 按鈕事件
					$('.toggle').off('click').on('click', function (e) {
						e.preventDefault();
						$('body').toggleClass('navPanel-visible');
					});
				}
			});
		fetch('footer.html').then(r => r.text()).then(t => document.getElementById('footer').innerHTML = t);

		fetch('data/members.json')
			.then(response => response.json())
			.then(members => {
				const roleOrder = {
					'Research Assistant': 0,
					"PhD Student": 1,
					'Master Student': 2,
					'Bachelor Student': 3,
					'Alumni': 4
				};

				const sortMembers = (items) => {
					return [...items].sort((a, b) => {
						const aOrder = roleOrder[a.role] ?? 999;
						const bOrder = roleOrder[b.role] ?? 999;
						return aOrder - bOrder;
					});
				};

				const renderMemberCard = (member, withPhoto = true) => {
					const liItems = member.projects.map(project => `<li>${project}</li>`).join('');
					const photoHtml = withPhoto && member.photo
						? `<img src="${member.photo}" alt="${member.name}">`
						: '';

					return `
						<div class="member-card">
							${photoHtml}
							<div class="member-info">
								<h3>${member.name}</h3>
								<p class="role">${member.role}</p>
								<ul class="project-list">${liItems}</ul>
							</div>
						</div>
					`;
				};

				const currentMembersEl = document.getElementById('current-members');
				const alumniMembersEl = document.getElementById('alumni-members');
				const alumniNoPhotoEl = document.getElementById('alumni-no-photo');

				const currentMembers = sortMembers(members.filter(member => member.role !== 'Alumni'));
				const alumniMembers = sortMembers(members.filter(member => member.role === 'Alumni' && member.photo));
				const alumniNoPhotoMembers = sortMembers(members.filter(member => member.role === 'Alumni' && !member.photo));

				currentMembersEl.innerHTML = currentMembers.map(member => renderMemberCard(member, true)).join('');
				alumniMembersEl.innerHTML = alumniMembers.map(member => renderMemberCard(member, true)).join('');
				alumniNoPhotoEl.innerHTML = alumniNoPhotoMembers.map(member => renderMemberCard(member, false)).join('');
			})
			.catch(error => {
				console.error('Failed to load members data:', error);
			});
	</script>

</body>

</html>
